[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testpilot-triage"
version = "1.0.0"
description = "Evidence-grounded LangGraph CI failure triage over real BugSwarm build logs"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.60,<1.1",
    "langchain-core>=0.3.30,<2",
    "langchain-openai>=0.3.0,<1",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "scikit-learn>=1.4,<2",
    "numpy>=1.26,<3",
    "pandas>=2.0,<3",
    "fastapi>=0.110,<1",
    "uvicorn>=0.30,<1",
    "typer>=0.12,<1",
    "rich>=13.7,<15",
    "python-dotenv>=1.0,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.6,<1"]

[project.scripts]
testpilot = "testpilot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.setuptools.package-data]
testpilot = ["schema.sql"]
